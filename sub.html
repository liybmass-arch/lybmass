<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0c0f">
<meta name="color-scheme" content="dark light">
<title>Super JinX</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("/jinx-fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url("/jinx-fonts/Vazirmatn-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url("/jinx-fonts/Vazirmatn-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--c:#5eead4;--tg:#2aabee;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;--off:#94a3b8;--e:cubic-bezier(.22,.9,.24,1);--sp:cubic-bezier(.34,1.56,.64,1)}
[data-theme=dark]{--a:#8ea2ff;--on:#0b0c0f;--bg:#0b0c0f;--dev:#121418;--s1:#14161b;--s2:#1a1d23;--s3:#262a32;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--t1:#f2f3f5;--t2:#a0a5b1;--t3:#6c727f;--pass:linear-gradient(150deg,#3b49bf 0%,#242c78 55%,#171b49 100%);--glow:rgba(142,162,255,.1)}
[data-theme=light]{--a:#4659d8;--on:#fff;--bg:#f4f5f7;--dev:#fff;--s1:#fff;--s2:#f0f1f4;--s3:#e4e6ec;--line:rgba(15,20,40,.08);--line2:rgba(15,20,40,.15);--t1:#12141a;--t2:#545a68;--t3:#8a909d;--pass:linear-gradient(150deg,#5b6df0 0%,#4256d6 55%,#3544b8 100%);--glow:rgba(70,89,216,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:14px;scroll-padding-bottom:96px}
html.lock,html.lock body{overflow:hidden}
body{min-height:100vh;background:var(--bg);color:var(--t1);font-family:"Vazirmatn",-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;font-size:14px;line-height:1.65;font-variant-numeric:tabular-nums;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:60vh;z-index:0;pointer-events:none;background:radial-gradient(60% 70% at 50% 0%,var(--glow),transparent 75%)}
.ltr{direction:ltr;unicode-bidi:isolate}
button,a{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
/* intro (auto-removes even if JS dies) */
.intro{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);animation:ig-out .45s var(--e) 1s forwards;pointer-events:none}
.intro .ig{width:72px;height:72px;color:var(--a)}
.intro .ig path{stroke-dasharray:220;stroke-dashoffset:220;animation:draw .8s var(--e) forwards}.intro .ig .sg-j{animation-delay:.15s}.intro .ig .sg-bolt{animation-delay:.3s}
.intro p{position:absolute;top:calc(50% + 56px);left:0;right:0;text-align:center;font:600 11px/1 "Vazirmatn",sans-serif;letter-spacing:5px;color:var(--t3);opacity:0;animation:fadein .4s .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}@keyframes ig-out{to{opacity:0;visibility:hidden}}
html.seen .intro{display:none}
/* layout: phone, tablet, desktop */
.device{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding:max(16px,calc(env(safe-area-inset-top) + 8px)) max(16px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:12px}
.cols,.col{display:contents}
.dnav{display:none}
@media (min-width:600px){.device{max-width:720px;padding:max(22px,calc(env(safe-area-inset-top) + 8px)) max(24px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}.stack{gap:14px}}
@media (min-width:900px){
  html:not(.vm) .device{max-width:1280px;padding:0 40px 48px;min-height:100vh}
  html:not(.vm) .stack{gap:20px}
  html:not(.vm) .top{position:sticky;top:0;z-index:30;margin:0 calc(50% - 50vw);padding:14px max(40px,calc(50vw - 50%))!important;background:var(--bg);border-bottom:1px solid var(--line)}
  html:not(.vm) .dnav{display:flex;gap:2px;margin-inline:auto;padding:3px;border-radius:12px;background:var(--s2)}
  html:not(.vm) .dnav a{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;text-decoration:none;color:var(--t2);font-size:13px;font-weight:500;transition:color .2s,background .2s}
  html:not(.vm) .dnav a svg{width:16px;height:16px}
  html:not(.vm) .dnav a:hover{color:var(--t1)}
  html:not(.vm) .dnav a.on{color:var(--t1);background:var(--s1);box-shadow:0 0 0 1px var(--line)}
  html:not(.vm) .cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start;padding-top:22px}
  html:not(.vm) .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  html:not(.vm){scroll-padding-top:84px}
  html:not(.vm) .cl{position:sticky;top:84px}
  html:not(.vm) .dock{display:none!important}
  html:not(.vm) .toast{bottom:28px}
  html:not(.vm) .uname{font-size:30px}
  html:not(.vm) #s-cfg .list{display:grid;grid-template-columns:1fr;gap:8px}
}
@media (min-width:1360px){html:not(.vm) .cols{grid-template-columns:minmax(0,440px) minmax(0,1fr)}html:not(.vm) #s-cfg .list{grid-template-columns:1fr 1fr}}
@media (min-width:900px) and (max-height:760px){html:not(.vm) .cl{position:static}}
.rise{opacity:0;transform:translateY(10px);animation:rise .55s var(--e) forwards}
@keyframes rise{to{opacity:1;transform:none}}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 6px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;color:var(--a);flex-shrink:0}
.word{display:block;font-size:16px;font-weight:700;letter-spacing:.2px;color:var(--t1);line-height:1.3}
.brand small{display:block;font-size:11px;color:var(--t3);margin-top:-2px}
.tools{display:flex;gap:6px}
.ib{position:relative;overflow:hidden;height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--t2);cursor:pointer;font:600 11.5px/1 "Vazirmatn",sans-serif;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s,transform .15s var(--sp)}
@media (hover:hover){.ib:hover{color:var(--t1);border-color:var(--line2)}}
.ib:active{transform:scale(.92)}.ib svg{width:17px;height:17px}
/* pass: the one bold element */
.pass-wrap{perspective:900px}
.pass{--rx:0deg;--ry:0deg;--mx:50%;--my:20%;--acc:#fff;position:relative;overflow:hidden;isolation:isolate;border-radius:26px;color:#fff;background:var(--pass);transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0);transition:transform .5s var(--e);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 24px 50px -28px rgba(30,40,140,.7)}
.pass.tilt{transition:transform .08s linear}
.pass::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(255,255,255,.16),transparent 55%)}
.pass.st-expired,.pass.st-limited{--acc:#ffc2cb}.pass.st-disabled{--acc:#cbd5e1}.pass.st-on_hold{--acc:#bfdbfe}
.pass>div{position:relative;z-index:1}
.p-top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.p-lbl{font:600 11px/1 "Vazirmatn",sans-serif;letter-spacing:2px;color:rgba(255,255,255,.72)}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:rgba(7,9,30,.38);color:#fff}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-active i{color:var(--ok);animation:beat 2.2s ease-in-out infinite}.s-limited i{color:var(--warn)}.s-expired i{color:var(--bad)}.s-disabled i{color:var(--off)}.s-on_hold i{color:var(--info)}
@keyframes beat{50%{opacity:.35;transform:scale(.75)}}
.p-mid{padding:26px 20px 22px}
.p-mid small,.stub small{display:block;font-size:11px;color:rgba(255,255,255,.62)}
.uname{font-size:26px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.serial{margin-top:6px;font:500 11.5px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;color:rgba(255,255,255,.55)}
.stub{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px;padding:16px 20px 20px;border-top:1px solid rgba(255,255,255,.16);background:rgba(7,9,30,.18)}
.stub>div{min-width:0}
.stub b{display:flex;align-items:baseline;gap:5px;font-size:26px;font-weight:700;line-height:1.25;color:#fff;white-space:nowrap}
[dir=rtl] .stub b.ltr{justify-content:flex-end}.stub>div+div{padding-inline-start:10px;border-inline-start:1px solid rgba(255,255,255,.14)}
.stub b em{font-style:normal;font-size:12px;font-weight:600;color:rgba(255,255,255,.75)}
.stub b.sm{font-size:13px;font-weight:600;line-height:1.5;margin-top:6px;display:block;white-space:normal;overflow-wrap:anywhere}
.cd{font-variant-numeric:tabular-nums;color:var(--acc)!important}
/* banners */
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;font-size:12.5px;border:1px solid}
.banner svg{width:18px;height:18px;flex-shrink:0}.banner .grow{font-weight:500}
.banner.bad{color:var(--bad);background:rgba(251,113,133,.09);border-color:rgba(251,113,133,.28)}
.banner.warn{color:var(--warn);background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.26)}
.banner.info{color:var(--info);background:rgba(96,165,250,.09);border-color:rgba(96,165,250,.26)}
[data-theme=light] .banner.warn{color:#a16207}[data-theme=light] .banner.bad{color:#be123c}[data-theme=light] .banner.info{color:#1d4ed8}
/* telemetry */
.tele{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px}
.tl{position:relative;overflow:hidden;padding:11px 10px 10px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:center;min-width:0}
.tl span{display:block;font-size:11px;color:var(--t3);white-space:nowrap}
.tl b{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;position:relative;z-index:1}
.tl b i{width:7px;height:7px;border-radius:50%;background:currentColor}
.spark{position:absolute;inset:auto 0 0 0;width:100%;height:12px;opacity:.6;z-index:0}
.tl.has-sp{padding-bottom:15px}
.spark polyline{fill:none;stroke:var(--a);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.on-c{color:var(--ok)}.off-c{color:var(--t2)}.mid-c{color:var(--warn)}.bad-c{color:var(--bad)}
[data-theme=light] .on-c{color:#059669}[data-theme=light] .mid-c{color:#b45309}[data-theme=light] .bad-c{color:#e11d48}
/* panels */
.panel{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px}
.ph h2 svg{width:18px;height:18px;color:var(--t3)}
.ph .aux{font-size:11.5px;color:var(--t3)}
/* telegram: channel + bot */
.panel.tg{padding:10px}
.portal{text-decoration:none;color:var(--t1);cursor:pointer}
@media (hover:hover){a.portal:hover{border-color:var(--line2);background:var(--s3)}}
a.portal:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.orb{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;background:var(--tg);color:#fff}
.orb svg{width:21px;height:21px}
.orb.bo{background:var(--s3);color:var(--a)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-inline-end:6px;vertical-align:1px;animation:beat 2s ease-in-out infinite}
.row .grow small.ltr{text-align:start}
.go{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:12px;font-size:12.5px;font-weight:700;background:var(--a);color:var(--on);flex-shrink:0;transition:transform .2s var(--sp)}
.go svg{width:15px;height:15px}
[dir=rtl] .go svg,[dir=rtl] .flip svg{transform:scaleX(-1)}
.portal:active .go{transform:scale(.94)}
/* usage rings */
.reactor{display:flex;align-items:center;gap:16px}
.rings{position:relative;width:124px;height:124px;flex-shrink:0}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--s3);stroke-width:8}
.rv,.rv2{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--e)}
.rv{stroke-width:8;stroke:var(--a)}
.rv2{stroke-width:6;stroke:var(--c)}
[data-theme=light] .rv2{stroke:#0d9488}
.rv.r-warn,.rv2.r-warn{stroke:var(--warn)}.rv.r-bad,.rv2.r-bad{stroke:var(--bad)}
.core{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.core b{font-size:24px;font-weight:700;line-height:1}.core small{font-size:11px;color:var(--t3);margin-top:3px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.lg{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.lg i{width:9px;height:9px;border-radius:50%;grid-row:span 2}.lg .d1{background:var(--a)}.lg .d2{background:var(--c)}
[data-theme=light] .lg .d2{background:#0d9488}
.lg span{font-size:11px;color:var(--t3)}.lg b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start;justify-self:start}[dir=rtl] .lg b.ltr{text-align:right;justify-self:start}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.fact{padding:11px 12px;border-radius:14px;background:var(--s2);min-width:0}
.fact span{display:block;font-size:11px;color:var(--t3)}.fact b{display:block;font-size:12.5px;font-weight:600;margin-top:1px;white-space:normal;overflow-wrap:anywhere;line-height:1.45}
/* link field */
.field{width:100%;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);cursor:pointer;text-align:start;transition:border-color .2s,background .2s,transform .15s var(--sp)}
@media (hover:hover){.field:hover{border-color:var(--line2);background:var(--s3)}}
.field:active{transform:scale(.99)}
.field code{flex:1;min-width:0;font:12.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
.field .hint{font-size:11px;color:var(--a);white-space:nowrap;flex-shrink:0;font-weight:500}
.field svg{width:16px;height:16px;flex-shrink:0;color:var(--ok)}.field.ok{border-color:var(--ok);background:rgba(52,211,153,.08)}.field.ok .hint{color:var(--ok)}
/* buttons */
.btns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:10px}.btns.two{grid-template-columns:1fr 1fr;margin-top:14px}
.b{--bh:44px;position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--bh);padding:0 15px;border-radius:13px;border:1px solid var(--line2);background:var(--s2);color:var(--t1);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:manipulation;transition:transform .15s var(--sp),border-color .2s,background .2s,color .2s}
.b svg{width:16px;height:16px;flex-shrink:0;position:relative;z-index:1}
.b>span{position:relative;z-index:1}
@media (hover:hover){.b:hover{background:var(--s3)}}
.b:active{transform:scale(.96)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.field:focus-visible,.dock a:focus-visible,.ops button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.b.pri{background:var(--a);border-color:transparent;color:var(--on)}
@media (hover:hover){.b.pri:hover{background:var(--a);filter:brightness(1.1)}}
.b.ok,.b.pri.ok{background:rgba(52,211,153,.16)!important;border-color:rgba(52,211,153,.6)!important;color:var(--ok)!important;filter:none!important}
.b.ok svg{animation:pop .4s var(--sp)}@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
[data-theme=light] .b.ok,[data-theme=light] .b.pri.ok{color:#047857!important}
.b.busy{pointer-events:none}.b.busy svg,.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.b[disabled]{opacity:.6;pointer-events:none}
.rp{position:absolute;z-index:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;background:currentColor;opacity:.18;transform:scale(0);animation:rp .55s var(--e) forwards}
@keyframes rp{to{transform:scale(26);opacity:0}}
.b.sm{--bh:36px;padding:0 12px;font-size:12px;border-radius:11px}.b.ic{width:40px;--bh:40px;padding:0;border-radius:12px}.b.full{width:100%}
.upd{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--t3)}.upd svg{width:14px;height:14px;flex-shrink:0}.upd .grow{flex:1;min-width:0}
/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:16px;background:var(--s2);border:1px solid transparent;transition:border-color .2s,background .2s}
@media (hover:hover){.row:hover{border-color:var(--line2)}}
.glyph{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-weight:700;font-size:15px;color:var(--a);background:var(--s3)}
.grow{flex:1;min-width:0}
.grow b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow small{display:block;font-size:11.5px;color:var(--t3)}
.tag{display:inline-block;margin-inline-start:6px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:700;color:var(--a);background:var(--s3);vertical-align:2px}
.acts{display:flex;gap:6px;flex-shrink:0}
.app .grow b{display:flex;align-items:center;gap:6px}.app .grow b{overflow:hidden}.app .grow b .ltr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.app .tag{vertical-align:0;line-height:1.5}
.cfg .grow b{font-weight:500;unicode-bidi:plaintext}
.cfg .grow small{text-align:start;margin-top:2px}
.idx{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--t3);width:26px;height:40px;display:grid;place-items:center;flex-shrink:0}
.pr{display:inline-block;font:700 9.5px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.5px;text-transform:uppercase;padding:0 6px;border-radius:5px;color:var(--a);background:var(--s3)}
.pr-vmess{color:#7dd3fc;background:rgba(56,189,248,.12)}.pr-trojan{color:#fda4af;background:rgba(251,113,133,.12)}.pr-ss{color:#86efac;background:rgba(52,211,153,.12)}
.pgc{display:inline-block;margin-inline-start:6px;font-size:10px;font-weight:700;line-height:1.6;padding:0 7px;border-radius:5px;color:var(--t2);background:var(--s3);font-variant-numeric:tabular-nums}
.pgc.on{color:#86efac;background:rgba(52,211,153,.12)}.pgc.mid{color:#fcd34d;background:rgba(251,191,36,.12)}.pgc.bad{color:#fca5a5;background:rgba(248,113,113,.12)}
.pick{display:inline-block;margin-inline-start:6px;font-size:10px;font-weight:700;line-height:1.6;padding:0 7px;border-radius:5px;color:var(--on);background:var(--a)}
.ptip{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--s2)}
.ptip>svg{flex:none;width:18px;height:18px;color:var(--t3)}.ptip b{display:block;font-size:12.5px}.ptip small{display:block;font-size:11px;color:var(--t3);line-height:1.7}
